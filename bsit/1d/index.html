                 <!DOCTYPE html>
<html lang="en" style="color-scheme:dark;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1D - Dark Mode Gist</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body, .gist-container, p, h1, h2, h3, button { font-family: 'Inter', sans-serif; }
:root{ --dim:#181c20; --dark:#0c0c10; --text:#fafaff; --link:#6aa6ff; }

body {background:var(--dark)!important; padding:20px; padding-bottom: 120px; margin:0;}

/* --- DOT LOADER SCREEN --- */
#loader {
    position: fixed; inset: 0; background: var(--dark); z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.4s ease, visibility 0.4s;
}
.dot-container { display: flex; gap: 8px; }
.dot {
    width: 30px; height: 30px; background: var(--link);
    border-radius: 50%; opacity: 0.3;
    animation: dot-fade 1.4s infinite linear;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot-fade {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
}
#loader.fade-out { opacity: 0; visibility: hidden; }

/* --- MODAL STYLING --- */
#modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center; z-index: 10001;
}
#modal {
    background: var(--dim); width: 85%; max-width: 300px;
    padding: 25px; border-radius: 24px;  text-align: center;
}
#modal h2 { font-size: 20px; margin-bottom: 8px; }
#modal p { color: #888; font-size: 14px; margin-bottom: 20px; }
#dest-name { color: var(--link); font-weight: 700; text-transform: capitalize; }
.modal-btn-group { display: flex; gap: 10px; }
.modal-btn {
    flex: 1; padding: 14px; border: none; border-radius: 14px;
    font-weight: 700; cursor: pointer; transition: 0.2s;
}
.confirm { background: var(--link); color: #000; }
.cancel { background: #fafaff; color: var(--link); }

/* --- GIST CLEANUP --- */
body .gist-meta, body .anchor, .gist-canvas { display: none !important; }

.gist-btn {
    width: 100%; text-align: left; margin-top: 15px; padding: 18px 20px;
    background: var(--link); border-radius: 16px; color: #000;
    border: none; font-weight: 700; cursor: pointer; display: block;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.gist-btn:hover { border-radius: 22px; transform: translateY(-2px); }
.gist-btn:active { transform: scale(0.96); border-radius: 12px; }

body .gist .markdown-body pre, .gist .markdown-body code {
    background:#0a0a0f!important; padding:10px; border-radius:8px; border: 1px solid #1a1a22;
}
[hidden]{display:none !important;}

/* --- DOCK STYLING --- */
#nav { 
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 999;
    background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px); padding: 10px; border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}
.nav-btn {
    width: 56px; height: 56px; border-radius: 18px;
    background: transparent; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); font-size: 20px; transition: all 0.3s ease;
}
.nav-btn.active { background: var(--link); color: #000; }
</style>
</head>
<body>

<div id="loader">
    <div class="dot-container">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</div>

<div id="modal-overlay">
    <div id="modal">
        <h2>Continue?</h2>
        <p>This will open <span id="dest-name">...</span> in a new tab.</p>
        <div class="modal-btn-group">
            <button class="modal-btn cancel" onclick="closeModal()">Back</button>
            <button id="modal-confirm" class="modal-btn confirm">Open</button>
        </div>
    </div>
</div>

<audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

<script src="https://gist.github.com/actwu/ae1118a75a45e14e4b5817e2b90c24cb.js"></script>

<div id="nav">
  <button id="btn-a" class="nav-btn active" onmousedown="showFile('file-a-md', this)" title="Home"><i class="fa-solid fa-house"></i></button>
  <button id="btn-b" class="nav-btn" onmousedown="showFile('file-b-md', this)" title="News"><i class="fa-solid fa-circle-exclamation"></i></button>
</div>

<script>
let pendingUrl = "";
const clickSound = document.getElementById('click-sound');

function playTap() {
    clickSound.currentTime = 0;
    clickSound.play().catch(e => {}); 
}

function showFile(id, btn){
    playTap();
    const fA = document.getElementById("file-a-md");
    const fB = document.getElementById("file-b-md");
    if(fA) fA.setAttribute("hidden", "");
    if(fB) fB.setAttribute("hidden", "");
    const target = document.getElementById(id);
    if(target) target.removeAttribute("hidden");
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function openModal(url) {
    playTap();
    pendingUrl = url;
    try {
        const domain = new URL(url).hostname.split('.').reverse()[1];
        document.getElementById('dest-name').innerText = domain;
    } catch(e) {
        document.getElementById('dest-name').innerText = "Link";
    }
    document.getElementById('modal-overlay').style.display = 'flex';
}

function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

document.getElementById('modal-confirm').onclick = () => {
    window.open(pendingUrl, '_blank');
    closeModal();
};

window.onload = () => {
    setTimeout(() => {
        const gistCSS = document.querySelector('link[href*="githubassets"]');
        if(gistCSS) gistCSS.remove();
        
        // ONLY turn external links (starts with http) into buttons
        document.querySelectorAll('.gist a').forEach(a => {
            if (a.getAttribute('href').startsWith('http')) {
                const btn = document.createElement('button');
                btn.className = 'gist-btn';
                btn.innerHTML = a.innerHTML;
                const url = a.href;
                btn.onclick = () => openModal(url);
                a.parentNode.replaceChild(btn, a);
            }
        });

        document.querySelectorAll('p').forEach(p => { if(p.textContent.trim() === ".") p.style.display = "none"; });
        const fileB = document.getElementById("file-b-md");
        if(fileB) fileB.setAttribute("hidden", "");
        document.getElementById('loader').classList.add('fade-out');
    }, 800); 
};
</script>

</body>
</html>
