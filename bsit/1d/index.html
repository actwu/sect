<!DOCTYPE html>
<html lang="en" style="color-scheme:dark;>
<head>
<meta charset="UTF-8">
<title>1D - Dark Mode Gist</title>


<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body, .gist-container, p, h1, h2, h3, a, button {
    font-family: 'Inter', sans-serif;
}
:root{
--dim:#13131a;
--dark:#0c0c10;
--text:#fafaff;
--link:#6aa6ff;
}


body {background:var(--dark)!important; border-radius:10px;padding:20px;gap:10px;}
body .gist-meta, .anchor{display:none !important;}

body .gist a{

margin-top:15px;
padding: 15px 20px;
    background: var(--link);
    border-radius: 15px;
    color: #181c20;
    text-decoration: none;
display: block;


}

body .gist .markdown-body pre,.gist .markdown-body code{background:#0a0a0f!important;padding:4px 6px;border-radius:4px;}

h1 {
font-size:38px;
margin:0;
padding:0;
}

h2 {
font-size:22px;
margin:0;
padding:0;
}


</style>

</head>
<body>
<script src="https://gist.github.com/actwu/ae1118a75a45e14e4b5817e2b90c24cb.js"></script>
<script>

const gcn = document.querySelector('link[href="https://github.githubassets.com/assets/gist-embed-68783a026c0c.css"]');

if (gcn) {
    gcn.remove();
}

document.querySelectorAll('p').forEach(p => {
    if (p.textContent.trim() === ".") {
        p.style.opacity = "0";
    }
});
</script>
</body>
</html>
